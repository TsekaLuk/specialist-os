name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/e2e -v
      - run: python -m unittest discover -s tests/e2e -p test_package_e2e.py -v
        env:
          SPECIALIST_RUN_PACKAGE_E2E: "1"
      - run: python scripts/release_check.py --require-artifacts
      - run: python -m build --wheel --sdist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
