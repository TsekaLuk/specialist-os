name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv lock --check --no-config --default-index https://pypi.org/simple
      - run: python -m pip install build setuptools
      - run: python -m pip install pip-audit
      - run: pip-audit --progress-spinner off
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/e2e -v
      - run: python -m unittest discover -s tests/e2e -p test_package_e2e.py -v
        env:
          SPECIALIST_RUN_PACKAGE_E2E: "1"
      - run: python scripts/release_check.py --require-artifacts --tag "$GITHUB_REF_NAME"
      - run: python -m build --wheel --sdist
      - run: python scripts/generate_sbom.py --output dist/sbom.cdx.json
      - run: (cd dist && sha256sum sbom.cdx.json specialist_os-*.whl specialist_os-*.tar.gz) > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
