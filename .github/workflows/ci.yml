name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/e2e -v
      - run: python -m specialist doctor
      - run: python -m json.tool registry/models.yaml >/dev/null
      - run: python -m json.tool registry/models.schema.json >/dev/null
      - run: python -m json.tool schemas/result-envelope.schema.json >/dev/null
      - run: python -m json.tool schemas/capability-results.schema.json >/dev/null
      - run: python scripts/release_check.py
      - run: python -m pip install build setuptools
      - run: python -m build

  package-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools
      - run: SPECIALIST_RUN_PACKAGE_E2E=1 python -m unittest discover -s tests/e2e -p test_package_e2e.py -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust-core/Cargo.toml
      - run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo check --manifest-path rust-core/Cargo.toml --features python
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file rust-core/Cargo.lock

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/e2e -v
      - run: python -m specialist doctor --json
      - run: python scripts/release_check.py --require-artifacts

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv lock --check --no-config --default-index https://pypi.org/simple
      - run: python -m pip install pip-audit
      - run: pip-audit --progress-spinner off
      - run: python scripts/release_check.py --require-artifacts
      - run: python scripts/generate_sbom.py --output dist/sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/sbom.cdx.json
