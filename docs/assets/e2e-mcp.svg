<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Specialist Runtime MCP E2E</title>
  <desc id="desc">A terminal-style screenshot showing MCP initialization, tool discovery and a structured tool result.</desc>
  <rect width="1200" height="720" rx="18" fill="#15151d"/>
  <rect width="1200" height="74" rx="18" fill="#252334"/>
  <rect y="56" width="1200" height="18" fill="#252334"/>
  <circle cx="36" cy="37" r="9" fill="#ff6b6b"/>
  <circle cx="66" cy="37" r="9" fill="#ffd166"/>
  <circle cx="96" cy="37" r="9" fill="#6ee7b7"/>
  <text x="600" y="45" fill="#bdb6d3" font-family="SFMono-Regular,Consolas,monospace" font-size="20" text-anchor="middle">specialist / e2e-mcp</text>
  <text x="54" y="126" fill="#c4b5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="21">E2E / MCP</text>
  <text x="54" y="174" fill="#f5f3ff" font-family="SFMono-Regular,Consolas,monospace" font-size="24">$ specialist serve --mcp</text>
  <text x="54" y="218" fill="#9f94bd" font-family="SFMono-Regular,Consolas,monospace" font-size="21">&lt;- initialize  protocolVersion: 2024-11-05</text>
  <text x="54" y="254" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="21">-&gt; serverInfo: specialist-runtime 1.0.4</text>
  <text x="54" y="318" fill="#9f94bd" font-family="SFMono-Regular,Consolas,monospace" font-size="21">&lt;- tools/list</text>
  <text x="54" y="354" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="21">-&gt; 8 tools: vision_ocr, vision_detect, ...</text>
  <text x="54" y="418" fill="#9f94bd" font-family="SFMono-Regular,Consolas,monospace" font-size="21">&lt;- tools/call  vision_ocr  { path: "note.txt" }</text>
  <text x="54" y="454" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="21">-&gt; structuredContent.error: null</text>
  <text x="54" y="490" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="21">-&gt; result.blocks[0].text: "E2E hello"</text>
  <rect x="54" y="568" width="278" height="38" rx="19" fill="#302a4c"/>
  <text x="193" y="594" fill="#c4b5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="17" text-anchor="middle">stdio JSON-RPC transport</text>
  <rect x="354" y="568" width="236" height="38" rx="19" fill="#203b3a"/>
  <text x="472" y="594" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="17" text-anchor="middle">typed result envelope</text>
</svg>
