<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Specialist Runtime user-visible results</title>
  <desc id="desc">A product-style result board showing object detection and segmentation on a room image, OCR text blocks, a depth preview, and the normalized result envelope.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#193139" flood-opacity="0.12"/>
    </filter>
    <clipPath id="roomClip"><rect x="70" y="220" width="700" height="590" rx="18"/></clipPath>
    <linearGradient id="depth" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#132f3d"/>
      <stop offset="0.42" stop-color="#2b7f86"/>
      <stop offset="0.75" stop-color="#e3b85b"/>
      <stop offset="1" stop-color="#f26b5b"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bce5e4"/>
      <stop offset="1" stop-color="#80c1c6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="960" fill="#f3f7f5"/>
  <rect x="36" y="36" width="1528" height="888" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="78" y="96" fill="#257f7a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">SPECIALIST RUNTIME / USER-VISIBLE OUTPUT</text>
  <text x="78" y="152" fill="#132f3d" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">One input. Three specialist results.</text>
  <text x="78" y="188" fill="#60757a" font-family="Inter,Arial,sans-serif" font-size="20">A local capability call turns media into structured, inspectable output your agent can use immediately.</text>
  <rect x="1274" y="78" width="238" height="48" rx="24" fill="#e5f5ef"/>
  <circle cx="1302" cy="102" r="7" fill="#2ca58d"/>
  <text x="1320" y="109" fill="#1f6f63" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">LOCAL / READY</text>

  <!-- Input image with model annotations -->
  <rect x="70" y="220" width="700" height="590" rx="18" fill="#e8f0ed"/>
  <g clip-path="url(#roomClip)">
    <rect x="70" y="220" width="700" height="365" fill="#e6f1ef"/>
    <rect x="70" y="585" width="700" height="225" fill="#d5e1dc"/>
    <rect x="70" y="570" width="700" height="16" fill="#c1d0ca"/>
    <rect x="128" y="278" width="222" height="218" rx="8" fill="url(#window)" stroke="#ffffff" stroke-width="12"/>
    <path d="M239 278v218M128 387h222" stroke="#ffffff" stroke-width="8"/>
    <rect x="137" y="287" width="204" height="200" fill="none" stroke="#579aa0" stroke-width="2" opacity="0.6"/>
    <path d="M70 585h700" stroke="#b2c4bd" stroke-width="5"/>
    <rect x="388" y="496" width="282" height="32" rx="4" fill="#a45f42"/>
    <rect x="414" y="528" width="14" height="128" fill="#874c38"/>
    <rect x="629" y="528" width="14" height="128" fill="#874c38"/>
    <rect x="422" y="467" width="114" height="30" rx="4" fill="#253e46"/>
    <rect x="434" y="442" width="90" height="25" rx="3" fill="#ffffff" stroke="#aac8c3" stroke-width="3"/>
    <rect x="547" y="420" width="82" height="76" rx="8" fill="#e9a94e"/>
    <rect x="559" y="432" width="58" height="54" rx="4" fill="#f6d17e"/>
    <path d="M573 496v62M606 496v62M548 558h82" stroke="#be7538" stroke-width="8" stroke-linecap="round"/>
    <path d="M696 520c-36 0-58 23-58 62v76h102v-76c0-39-20-62-44-62z" fill="#e67c67"/>
    <path d="M680 520c-5-38 20-70 53-66 31 5 49 39 34 68" fill="#d8695a"/>
    <path d="M680 546c-30 3-44 32-44 63M733 546c29 3 45 33 45 63" stroke="#bd5c50" stroke-width="12" stroke-linecap="round"/>
    <rect x="695" y="588" width="16" height="70" fill="#9e5847"/>
    <rect x="753" y="588" width="16" height="70" fill="#9e5847"/>
    <path d="M106 692c35-63 69-63 104 0" fill="none" stroke="#3b8a69" stroke-width="18"/>
    <path d="M144 692c-15-57 12-87 43-104M173 692c20-47 50-57 73-65M119 692c-2-45-29-66-58-73" fill="none" stroke="#4b9b73" stroke-width="15" stroke-linecap="round"/>
    <rect x="97" y="687" width="118" height="74" rx="12" fill="#d98656"/>
    <rect x="101" y="682" width="110" height="15" rx="7" fill="#bc6e4b"/>

    <!-- detection boxes -->
    <rect x="534" y="407" width="103" height="101" rx="8" fill="none" stroke="#e85d4a" stroke-width="4"/>
    <rect x="534" y="377" width="154" height="30" rx="7" fill="#e85d4a"/>
    <text x="546" y="398" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">chair 0.96</text>
    <rect x="378" y="431" width="304" height="235" rx="8" fill="none" stroke="#2c9c8d" stroke-width="4"/>
    <rect x="378" y="401" width="148" height="30" rx="7" fill="#2c9c8d"/>
    <text x="390" y="422" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">desk 0.98</text>
    <path d="M648 510c-42 13-58 58-46 109 20 52 89 55 126 15 24-35 15-93-15-115-20-15-45-17-65-9z" fill="#2ca58d" fill-opacity="0.20" stroke="#2ca58d" stroke-width="4" stroke-dasharray="9 7"/>
    <rect x="622" y="661" width="139" height="30" rx="7" fill="#2ca58d"/>
    <text x="634" y="682" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">segment: person</text>
  </g>
  <rect x="70" y="220" width="700" height="590" rx="18" fill="none" stroke="#d4e2de" stroke-width="2"/>
  <rect x="94" y="244" width="130" height="32" rx="16" fill="#132f3d" fill-opacity="0.9"/>
  <text x="159" y="266" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">room.jpg</text>
  <text x="94" y="844" fill="#60757a" font-family="Inter,Arial,sans-serif" font-size="17">vision.detect + vision.segment</text>

  <!-- OCR result card -->
  <rect x="814" y="220" width="698" height="222" rx="18" fill="#fbfcfb" stroke="#d8e5e1" stroke-width="2"/>
  <circle cx="854" cy="263" r="18" fill="#e9f7f3"/>
  <text x="854" y="270" fill="#247f75" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle">T</text>
  <text x="888" y="260" fill="#132f3d" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">vision.ocr</text>
  <text x="888" y="288" fill="#60757a" font-family="Inter,Arial,sans-serif" font-size="16">Text blocks returned with coordinates and confidence</text>
  <rect x="850" y="318" width="176" height="88" rx="8" fill="#fffdf8" stroke="#efdcb8" stroke-width="2"/>
  <rect x="868" y="335" width="91" height="8" rx="4" fill="#d2e0dc"/>
  <rect x="868" y="353" width="135" height="8" rx="4" fill="#d2e0dc"/>
  <rect x="868" y="371" width="112" height="8" rx="4" fill="#d2e0dc"/>
  <rect x="868" y="389" width="74" height="8" rx="4" fill="#d2e0dc"/>
  <text x="1054" y="338" fill="#257f7a" font-family="SFMono-Regular,Consolas,monospace" font-size="18">blocks[0].text</text>
  <text x="1054" y="369" fill="#132f3d" font-family="SFMono-Regular,Consolas,monospace" font-size="21" font-weight="700">"TOTAL $2,480.00"</text>
  <text x="1054" y="400" fill="#60757a" font-family="SFMono-Regular,Consolas,monospace" font-size="17">confidence: 0.99</text>

  <!-- Depth result card -->
  <rect x="814" y="466" width="698" height="222" rx="18" fill="#fbfcfb" stroke="#d8e5e1" stroke-width="2"/>
  <circle cx="854" cy="509" r="18" fill="#fff1e7"/>
  <circle cx="854" cy="509" r="7" fill="#e85d4a"/>
  <text x="888" y="506" fill="#132f3d" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">vision.depth</text>
  <text x="888" y="534" fill="#60757a" font-family="Inter,Arial,sans-serif" font-size="16">A preview artifact plus dimensions, ready for downstream vision</text>
  <rect x="850" y="560" width="246" height="92" rx="8" fill="url(#depth)"/>
  <path d="M850 629h246M912 560v92M974 560v92M1036 560v92" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
  <text x="1118" y="585" fill="#132f3d" font-family="SFMono-Regular,Consolas,monospace" font-size="18">preview: depth.png</text>
  <text x="1118" y="616" fill="#60757a" font-family="SFMono-Regular,Consolas,monospace" font-size="17">mode: relative</text>
  <text x="1118" y="647" fill="#60757a" font-family="SFMono-Regular,Consolas,monospace" font-size="17">cache: miss → saved</text>

  <!-- Result envelope -->
  <rect x="814" y="712" width="698" height="98" rx="18" fill="#132f3d"/>
  <text x="850" y="749" fill="#9edbd0" font-family="SFMono-Regular,Consolas,monospace" font-size="17">result envelope</text>
  <text x="850" y="780" fill="#ffffff" font-family="SFMono-Regular,Consolas,monospace" font-size="18">provider: paddleocr  ·  latency_ms: 42  ·  error: null</text>
  <rect x="1305" y="738" width="164" height="36" rx="18" fill="#2ca58d"/>
  <text x="1387" y="762" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750" text-anchor="middle">agent-ready</text>

  <text x="78" y="884" fill="#60757a" font-family="Inter,Arial,sans-serif" font-size="16">Representative output from the stable capability contracts. Providers can change; capability names and result schemas stay predictable.</text>
</svg>
