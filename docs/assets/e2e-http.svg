<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Specialist Runtime HTTP E2E</title>
  <desc id="desc">A terminal-style screenshot showing health, readiness and metrics responses from the local HTTP server.</desc>
  <rect width="1200" height="720" rx="18" fill="#111923"/>
  <rect width="1200" height="74" rx="18" fill="#1b2938"/>
  <rect y="56" width="1200" height="18" fill="#1b2938"/>
  <circle cx="36" cy="37" r="9" fill="#ff6b6b"/>
  <circle cx="66" cy="37" r="9" fill="#ffd166"/>
  <circle cx="96" cy="37" r="9" fill="#6ee7b7"/>
  <text x="600" y="45" fill="#a7b8c8" font-family="SFMono-Regular,Consolas,monospace" font-size="20" text-anchor="middle">specialist / e2e-http</text>
  <text x="54" y="126" fill="#7dd3fc" font-family="SFMono-Regular,Consolas,monospace" font-size="21">E2E / HTTP</text>
  <text x="54" y="174" fill="#eef5f9" font-family="SFMono-Regular,Consolas,monospace" font-size="24">$ curl -s 127.0.0.1:8741/health</text>
  <text x="54" y="214" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">{ "status": "ok", "version": "1.0.4" }</text>
  <text x="54" y="278" fill="#eef5f9" font-family="SFMono-Regular,Consolas,monospace" font-size="24">$ curl -s 127.0.0.1:8741/ready</text>
  <text x="54" y="318" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">{ "status": "ready", "ready_capabilities": 8 }</text>
  <text x="54" y="382" fill="#eef5f9" font-family="SFMono-Regular,Consolas,monospace" font-size="24">$ curl -s 127.0.0.1:8741/metrics</text>
  <text x="54" y="424" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">specialist_requests_total 1</text>
  <text x="54" y="460" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">specialist_errors_total 0</text>
  <text x="54" y="496" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">specialist_cache_hits_total 0</text>
  <rect x="54" y="568" width="328" height="38" rx="19" fill="#17334a"/>
  <text x="218" y="594" fill="#7dd3fc" font-family="SFMono-Regular,Consolas,monospace" font-size="17" text-anchor="middle">loopback + bearer token ready</text>
  <rect x="404" y="568" width="216" height="38" rx="19" fill="#203b3a"/>
  <text x="512" y="594" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="17" text-anchor="middle">bounded concurrency</text>
</svg>
