<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Specialist Runtime CLI E2E</title>
  <desc id="desc">A terminal-style screenshot showing the capabilities command and a successful OCR result.</desc>
  <rect width="1200" height="720" rx="18" fill="#101820"/>
  <rect width="1200" height="74" rx="18" fill="#182632"/>
  <rect y="56" width="1200" height="18" fill="#182632"/>
  <circle cx="36" cy="37" r="9" fill="#ff6b6b"/>
  <circle cx="66" cy="37" r="9" fill="#ffd166"/>
  <circle cx="96" cy="37" r="9" fill="#6ee7b7"/>
  <text x="600" y="45" fill="#a7b8c8" font-family="SFMono-Regular,Consolas,monospace" font-size="20" text-anchor="middle">specialist / e2e-cli</text>
  <text x="54" y="126" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="21">E2E / CLI</text>
  <text x="54" y="174" fill="#eef5f9" font-family="SFMono-Regular,Consolas,monospace" font-size="24">$ specialist capabilities --json | jq 'length'</text>
  <text x="54" y="214" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="30">8</text>
  <text x="54" y="278" fill="#eef5f9" font-family="SFMono-Regular,Consolas,monospace" font-size="24">$ specialist --backend fallback ocr note.txt --json</text>
  <text x="54" y="322" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">{</text>
  <text x="82" y="358" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">"capability": "vision.ocr",</text>
  <text x="82" y="394" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">"provider": "paddleocr",</text>
  <text x="82" y="430" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">"result": { "blocks": [</text>
  <text x="110" y="466" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">{ "text": "E2E hello", "confidence": 1.0 }</text>
  <text x="82" y="502" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">] },</text>
  <text x="82" y="538" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">"error": null</text>
  <text x="54" y="574" fill="#9fb2c2" font-family="SFMono-Regular,Consolas,monospace" font-size="22">}</text>
  <rect x="54" y="622" width="238" height="38" rx="19" fill="#203b3a"/>
  <text x="173" y="648" fill="#75e6c2" font-family="SFMono-Regular,Consolas,monospace" font-size="17" text-anchor="middle">dependency-free path</text>
</svg>
